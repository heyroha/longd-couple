# 펫 돌보기 알림: 30분마다 청결·온기를 확인해서 40·30·20·10 아래로 내려갈 때마다 둘에게 알림 (밤낮 없이), 알 온기가 0이면 하늘나라로
# 필요: 저장소 Secret CRON_SECRET · APP_URL (gh secret set 으로 등록)
name: 펫 돌보기 알림

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 펫 상태 확인
        env:
          APP: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ] || [ -z "$APP" ]; then echo "CRON_SECRET · APP_URL Secret 이 없어서 건너뜀"; exit 0; fi
          curl -fsS -X POST "$APP/api/cron/pet" -H "x-cron-secret: $SECRET" -H 'Content-Type: application/json' -d '{}'
